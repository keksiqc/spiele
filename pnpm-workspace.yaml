minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@iconify-json/lucide@1.2.148'
  - '@x18n/builtins@0.1.2'
  - '@x18n/cli@0.1.2'
  - '@x18n/core@0.1.2'
  - '@x18n/node@0.1.2'
  - '@x18n/ui@0.1.2'
