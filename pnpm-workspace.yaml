minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - seroval@1.7.2
  - semver@6.3.1

update:
  ignoreDeps:
    - typescript@7

autoInstallPeers: false
strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

allowBuilds:
  esbuild: true
  nuxt-i18n-micro: true
  simple-git-hooks: true
  unrs-resolver: true
  workerd: true

permissions:
  '@x18n/cli':
    skills: false
